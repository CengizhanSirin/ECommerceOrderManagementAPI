services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
     test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
     interval: 5s
     timeout: 5s
     retries: 20
     start_period: 20s



  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: ecommerce-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
     test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
     interval: 5s
     timeout: 5s
     retries: 12
     start_period: 10s


  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-order-management-api:dev
    container_name: ecommerce-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      Database__ApplyMigrationsOnStartup: "true"

      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=${DATABASE_NAME};User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"

      Jwt__SecretKey: ${JWT_SECRET_KEY}

      Iyzico__ApiKey: ${IYZICO_API_KEY}
      Iyzico__SecretKey: ${IYZICO_SECRET_KEY}

      Email__Username: ${EMAIL_USERNAME}
      Email__Password: ${EMAIL_PASSWORD}
      Email__FromEmail: ${EMAIL_FROM_EMAIL}

      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USERNAME}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}

    ports:
      - "8080:8080"

    depends_on:
     sqlserver:
      condition: service_healthy
     rabbitmq:
      condition: service_healthy



volumes:
  sqlserver_data:
  rabbitmq_data: